{% extends "base.html" %}
{% block content %}
<section class="narrow">
  <h1>Anmelden</h1>
  <form method="post" class="stack">
    <label>Benutzername <input name="username" required autofocus autocomplete="username"></label>
    <label>Passwort <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="primary">Anmelden</button>
  </form>
</section>
{% endblock %}
