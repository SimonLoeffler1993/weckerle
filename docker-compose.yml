services:
  weckerle:
    image: ghcr.io/simonloeffler1993/weckerle:latest
    build: .
    container_name: weckerle
    # Host-Netzwerk ist nötig, damit Wake-on-LAN-Broadcasts das Heimnetz erreichen.
    network_mode: host
    environment:
      - PORT=8000
      - TZ=Europe/Berlin
    volumes:
      - weckerle-data:/data
    restart: unless-stopped

volumes:
  weckerle-data:
